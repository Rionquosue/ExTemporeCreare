[package]
name = "etc-bridge"
version = "0.1.0"
edition.workspace = true
license-file = "../../../LICENSE"
description = "Ex-Tempore Creare interface layer: the engine session behind a JNI surface for the Android UI"

[lints]
workspace = true

[lib]
name = "etcbridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-engine = { workspace = true, features = ["bundled-fonts", "heif"] }
vectorcraft-tools = { workspace = true }
vectorcraft-geom = { workspace = true }
vectorcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jni = { workspace = true }
